<text x="560" y="1000" font-size="17" font-weight="bold" fill="#222">Notes</text>
<text x="560" y="1026" font-size="15" font-weight="normal" fill="#222">• Power each board from its own USB port. Do not tie 3V3 or 5V together.</text>
<text x="560" y="1052" font-size="15" font-weight="normal" fill="#222">• GND must be common: B–A and A–target.</text>
<text x="560" y="1078" font-size="15" font-weight="normal" fill="#222">• 3.3 V signals only. Use a level shifter for 5 V or RS-232 targets.</text>
<text x="560" y="1104" font-size="15" font-weight="normal" fill="#222">• Avoided: GPIO6–11 (flash) and strapping pins 2, 5, 12, 15.</text>
<text x="560" y="1130" font-size="15" font-weight="normal" fill="#222">• GPIO32/33 assume no 32 kHz crystal (DevKitC has none).</text>
<text x="560" y="1156" font-size="15" font-weight="normal" fill="#222">• Pins match firmware/src/link_uart.rs and role_data.rs.</text>
