[package]
name = "usb-serial-over-tailscale-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ESP32-S3 firmware: interactive setup shell, USB serial host (CDC-ACM/FTDI/CP210x/CH34x), Tailscale node and TCP serial bridge"
rust-version = "1.77"

[[bin]]
name = "usb-serial-over-tailscale-firmware"
harness = false

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true

[profile.dev]
opt-level = "z"
debug = true

[features]
default = []
# Two-chip split (docs/split-design.md). Neither feature: single-chip node.
# Control chip "B": Wi-Fi, ts2021 control client, machine key, setup shell.
role-control = ["tsnode/split", "dep:splitlink"]
# Data chip "A": Wi-Fi, WireGuard/DERP/disco/ACL/smoltcp, target UART bridge.
role-data = ["tsnode/split", "dep:splitlink"]

[dependencies]
esp-idf-svc = { version = "0.52", features = ["std", "alloc", "binstart", "critical-section"] }
esp-idf-sys = "0.37"
esp-idf-hal = "0.46"
tsnode = { path = "../crates/tsnode", features = ["lowmem"] }
adapter-core = { path = "../crates/adapter-core" }
splitlink = { path = "../crates/splitlink", optional = true }
log = "0.4"
anyhow = "1"

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
esp_idf_tools_install_dir = "workspace"
# Default module variant; CI overrides this with ESP_IDF_SDKCONFIG_DEFAULTS.
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults", "variants/wroom32-nopsram.defaults"]
